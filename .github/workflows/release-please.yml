name: Release Please

# Opens or updates a release PR from conventional commits. Merging the PR creates the tag and
# the GitHub release, then this workflow packages and publishes the extension.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # passed to release.yml for Marketplace Trusted Publishing

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A release created with GITHUB_TOKEN does not start other workflows, so call it here.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
