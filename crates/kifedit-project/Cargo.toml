[package]
name = "kifedit-project"
version = "0.1.0"
edition = "2024"

[dependencies]
glob = "0.3.4"
ignore = "0.4.33"
kifedit-check = { version = "0.1.0", path = "../kifedit-check" }
kifedit-db = { version = "0.1.0", path = "../kifedit-db" }
kifedit-reason = { version = "0.1.0", path = "../kifedit-reason" }
kifedit-sema = { version = "0.1.0", path = "../kifedit-sema" }
kifedit-syntax = { version = "0.1.0", path = "../kifedit-syntax" }
rayon = "1.12.0"
salsa = "0.28.5"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
