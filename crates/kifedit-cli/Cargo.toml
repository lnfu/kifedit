[package]
name = "kifedit-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kifedit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
kifedit-project = { version = "0.1.0", path = "../kifedit-project" }
kifedit-syntax = { version = "0.1.0", path = "../kifedit-syntax" }

[dev-dependencies]
tempfile = "3.27.0"
